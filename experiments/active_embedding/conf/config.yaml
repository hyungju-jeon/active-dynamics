# @package _global_
# Base config for hydra entry

defaults:
  - _self_

hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 11
device: "cuda"
results_dir: ${hydra:run.dir}
action_dim: 2
observation_dim: 50
latent_dim: 2
dt : 0.1
run_offline: false
run_analysis: true

# Environment
environment:
  environment_type: "vectorfield"
  env_noise_scale: 0.01
  env_alpha: 10
  env_render_mode: null
  env_action_bounds: [-5, 5]
  observation_type: "linear"
  obs_noise_type: "gaussian"
  obs_noise_scale: 0.1
  action_type: "identity"
  env_dt: 0.1

# Model
model:
  encoder_type: "rnn"
  enc_hidden_dims: [0]
  enc_rnn_hidden_dims: [128]
  enc_rnn_type: "gru"
  enc_activation: "tanh"
  enc_h_init: "reset"
  mapping_type: "linear"
  map_hidden_dims: [0]
  map_activation: "tanh"
  noise_type: "gaussian"
  n_models: 1
  is_ensemble: false
  is_residual: true
  dynamics_type: "mlp"
  dyn_hidden_dims: [32]
  dyn_activation: "tanh"
  action_type: "mlp"
  act_hidden_dims: [32]
  act_activation: "tanh"
  model_type: "filtering-embedding"

# Policy 
policy:
  policy_type: "mpc-icem"
  mpc_verbose: False
  mpc_horizon: 20
  mpc_num_samples: 24
  mpc_num_iterations: 10
  mpc_num_elite: 10
  mpc_alpha: 0.1
  mpc_init_std: 0.5
  mpc_noise_beta: 1.0
  mpc_factor_decrease_num: 1.25
  mpc_frac_prev_elites: 0.2
  mpc_frac_elites_reused: 0.3
  mpc_use_mean_actions: True
  mpc_shift_elites: True
  mpc_keep_elites: True

# Metric (unused directly here)
metric:
  metric_type: ["embedding-fisher", "action"]
  compute_type: "sum"
  gamma: 0.99
  composite_weights: [1]
  met_use_diag: true
  met_discount_factor: 0.99
  met_goal: [2, 2]
  met_sensitivity: true
  met_covariance: "invariant"

# Training (offline parameters are what we sweep)
training:
  total_steps: 500
  train_every: 1
  rollout_horizon: 100
  optimizer: "SGD"
  learning_rate: 0.001
  weight_decay: 0.0001
  beta: 1
  n_epochs: 1
  k_steps: 1
  n_samples: 32
  perturbation: 0.00
  verbose: false
  grad_clip_norm: 1.0
  annealing_type: "linear" # "linear" or "cyclic"
  annealing_steps: 5000
  warmup: 20000
  offline_annealing_type: "linear" # "linear" or "cyclic"
  offline_annealing_steps: 500
  offline_warmup: 500
  offline_lr: 0.01
  offline_n_epochs: 1000
  offline_batch_size: 32
  offline_chunk_size: 500
  offline_decay: 0.0001
  p_mask: 0.5

# Logging
logging:
  save_every: 500
  plot_every: 1000
