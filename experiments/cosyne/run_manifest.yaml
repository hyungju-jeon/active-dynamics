manifest_version: 1
name: cosyne_parameter_id_mid_size_validation

commits:
  updated: "1ef4d6f"

locked_metadata_fields:
  - model_tag
  - commit
  - seed
  - exp_id
  - total_steps
  - base_dir
  - status
  - start_time
  - end_time

defaults:
  base_dir: "results/cosyne"
  model_tags: ["updated"]
  seeds: [0, 10, 20, 30, 40]
  exp_ids: ["active_short", "active_long", "RND", "random"]
  repeats: 1
  track_total_steps: 1000
  smoke_total_steps: 1000
  q_theta: 1.0e-4
  k_theta: 10
  gamma: 1.0
  writing_ref: "docs/active-dynamics-writing/methods.tex"

matrix:
  smoke:
    model_tag: "updated"
    seeds: [0]
    total_steps: 1000
  tracks:
    model_tags: ["updated"]
    exp_ids: ["active_short", "active_long", "RND", "random"]
    seeds: [0, 10, 20, 30, 40]
    total_steps: 1000
    repeats: 1

summary_outputs:
  csv: "results/cosyne/summary/metrics.csv"
  markdown: "results/cosyne/summary/metrics.md"
  figures_glob: "results/cosyne/summary/figures/*.png"

acceptance_thresholds:
  allow_nan_metrics: false
  max_failed_track_runs: 0
