# Configuration for running multiple seeds
# Usage: python baseline_comparison.py --config-name=seed_sweep --multirun
# set n_jobs = 5 in joblib launcher

# @package _global_
defaults:
  - config
  - _self_
  - override hydra/launcher: joblib # Use joblib launcher for parallel execution

# Override with different seeds and policy types (using proper Hydra sweep syntax)
# This creates a sweep over 5 different seed values and 2 policy types
hydra:
  launcher:
    n_jobs: 5
  # Ensure .hydra folder is created with configuration metadata
  sweeper:
      params:
        latent_dim: 4,6,8
        model.dyn_hidden_dim: "'[4,4]', '[8,8]', '[16]', '[32]'"
        model.act_hidden_dim: "'[4,4]', '[8,8]', '[16]', '[32]'"
        model.is_residual: true,false
        # latent_dim: 3, 4, 6,8
        # model.dyn_hidden_dim: "'[8,8]'"
        # model.act_hidden_dim: "'[8,8]'"
  sweep:
    subdir: "latent_${latent_dim}_dyn_${list_str:${model.dyn_hidden_dim}}_act_${list_str:${model.act_hidden_dim}}_residual_${model.is_residual}"