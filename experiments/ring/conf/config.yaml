# @package _global_
# Base config for offline_debug hydra entry

defaults:
  - _self_

hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 11
device: "cuda"
results_dir: ${hydra:run.dir}
action_dim: 2
observation_dim: 10
latent_dim: 2
dt: 1
run_offline: false
run_analysis: true

# Environment
environment:
  environment_type: "vectorfield"
  env_dynamics_type: "double_limit_cycle"
  env_noise_scale: 0.0
  env_render_mode: null
  env_action_bounds: [-1, 1]
  observation_type: "linear"
  obs_noise_type: "gaussian"
  obs_noise_scale: 0.1
  
  action_type: "mlp"
  act_hidden_dim: [4]
  act_activation: "tanh"


# Model
model:
  encoder_type: "rnn"
  enc_hidden_dim: [0]
  enc_rnn_hidden_dim: [64]
  enc_rnn_type: "gru"
  enc_activation: "tanh"
  enc_h_init: "reset"
  mapping_type: "linear"
  map_hidden_dim: [4, 4]
  map_activation: "tanh"
  noise_type: "gaussian"
  n_models: 1
  is_ensemble: false
  is_residual: true
  dynamics_type: "mlp"
  dyn_hidden_dim: [32]
  dyn_activation: "tanh"
  action_type: "mlp"
  act_hidden_dim: [4]
  act_activation: "tanh"
  model_type: "seq-vae"

# Policy 
policy:
  policy_type: "random"

# Metric (unused directly here)
metric:
  metric_type: ["D-optimality", "action"]
  compute_type: "sum"
  gamma: 0.99
  composite_weights: [.1, 5]
  met_use_diag: true
  met_discount_factor: 0.99
  met_goal: [2, 2]
  met_sensitivity: true
  met_covariance: "invariant"

# Training (offline parameters are what we sweep)
training:
  total_steps: 20000
  train_every: 1
  rollout_horizon: 10
  optimizer: "SGD"
  learning_rate: 0.0005
  weight_decay: 0.0001
  beta: 1
  n_epochs: 1
  k_steps: 1
  n_samples: 32
  perturbation: 0.00
  verbose: false
  grad_clip_norm: 1.0
  annealing_type: "linear" # "linear" or "cyclic"
  annealing_steps: 1000
  warmup: 1000
  offline_annealing_type: "linear" # "linear" or "cyclic"
  offline_annealing_steps: 500
  offline_warmup: 500
  offline_lr: 0.001
  offline_n_epochs: 1000
  offline_batch_size: 32
  offline_chunk_size: 200
  offline_decay: 0.0001

# Logging
logging:
  save_every: 1000
  plot_every: 1000
