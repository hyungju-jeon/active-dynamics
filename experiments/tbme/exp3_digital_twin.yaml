runtime:
  seed: 0
  device: auto

dataset:
  dataset_path: data/mcrtt/mcrtt_replay.npz
  spike_key: spikes
  behavior_key: behavior
  train_fraction: 0.7
  sequence_length: 128
  sequence_stride: 64
  max_units: 96
  max_train_sequences: null
  max_eval_sequences: 64

generator:
  latent_dim: 8
  encoder_type: rnn
  enc_hidden_dims: [64]
  enc_rnn_hidden_dims: [64]
  enc_rnn_type: gru
  enc_h_init: reset
  mapping_type: log-linear
  map_hidden_dims: [64]
  noise_type: poisson
  dynamics_type: mlp
  dyn_hidden_dims: [32, 32]
  dyn_activation: relu
  is_residual: false
  learning_rate: 0.001
  weight_decay: 1.0e-5
  batch_size: 16
  n_epochs: 60
  beta: 0.1
  n_samples: 3
  k_steps: 5
  grad_clip_norm: 10.0
  p_mask: 0.0
  annealing_type: linear
  annealing_steps: 1000
  warmup: 10
  behavior_readout_ridge: 0.001

twin:
  control_dim: 2
  action_low: -1.0
  action_high: 1.0
  control_scale: 0.45
  latent_clip_abs: 8.0
  stochastic_dynamics: true
  sample_observations: true
  num_initial_latents: 256
  probe_num_initial_latents: 16
  probe_horizon: 25
  probe_action_scale: 0.75
  probe_action_seed: 123

learner:
  freeze_encoder: true
  freeze_decoder: true
  freeze_action_encoder: true
  dynamics_init_noise_scale: 0.5
  inference_window: 32
  train_every: 5
  min_train_steps: 20
  batch_size: 16
  n_epochs_per_update: 3
  learning_rate: 0.001
  weight_decay: 1.0e-5
  grad_clip_norm: 10.0
  n_samples: 1
  k_steps: 1
  beta: 0.1
  p_mask: 0.0
  annealing_type: none
  annealing_steps: 1000
  warmup: 0

benchmark:
  policy_ids: [active_myopic, active_planning, baseline_prbs, random]
  seeds: [0, 10, 20]
  total_steps: 60
  eval_every: 5
  metric_type: d-optimality
  metric_use_diag: true
  metric_discount_factor: 0.99
  mpc_num_samples: 16
  mpc_num_iterations: 3
  mpc_num_elite: 4
  mpc_alpha: 0.1
  mpc_init_std: 0.5
  mpc_noise_beta: 1.0
  myopic_horizon: 2
  planning_horizon: 10
  prbs_hold_steps: 5
  prbs_amplitude: 1.0
  save_state_action_trace: true

summary:
  figure_formats: [.pdf]
