models:
  active_myopic:
    objective_kind: parameter_eig
    update_interval: 1
    replan_interval: 1
    planning_horizon: 2
    action_constraint: radius

  active_planning:
    objective_kind: parameter_eig
    update_interval: 20
    replan_interval: 20
    planning_horizon: 40
    action_constraint: radius
    coarse_dt_factor: 20
    coarse_action_mapping: hold

  flex:
    objective_kind: null
    update_interval: 1
    replan_interval: 1
    planning_horizon: 1
    policy_type: flex
    flex_regularization: 0.01
    flex_parameter_step_clip: 0.25
    flex_parameter_min: -5.0
    flex_parameter_max: 5.0
    flex_lr: null

  flex_true_state:
    objective_kind: null
    update_interval: 1
    replan_interval: 1
    planning_horizon: 1
    policy_type: flex
    use_true_state: true
    flex_regularization: 0.01
    flex_parameter_step_clip: 0.25
    flex_parameter_min: -5.0
    flex_parameter_max: 5.0
    flex_lr: null

  flex_safe:
    extends: flex
    policy_type: flex
    flex_regularization: 0.1

  rhc:
    objective_kind: null
    update_interval: 20
    replan_interval: 20
    planning_horizon: 20
    policy_type: rhc


  prbs:
    update_interval: 1
    replan_interval: 1
    planning_horizon: 1
    policy_type: baseline-prbs
    passive: true


# Schedule Experiment
  active_planning_u1_r1_h40:
    extends: active_planning
    update_interval: 1
    replan_interval: 1
    planning_horizon: 40

  active_planning_u5_r5_h40:
    extends: active_planning
    update_interval: 5
    replan_interval: 5
    planning_horizon: 40

  active_planning_u5_r10_h40:
    extends: active_planning
    update_interval: 5
    replan_interval: 10
    planning_horizon: 40

  active_planning_u5_r20_h40:
    extends: active_planning
    update_interval: 5
    replan_interval: 20
    planning_horizon: 40

  active_planning_u10_r20_h40:
    extends: active_planning
    update_interval: 10
    replan_interval: 20
    planning_horizon: 40

  active_planning_u10_r10_h40:
    extends: active_planning
    update_interval: 10
    replan_interval: 10
    planning_horizon: 40


# Adaptive
  adaptive:
    extends: active_planning
    adaptive_cadence: true
    adaptive_update_min_interval: 5
    adaptive_update_eig_threshold: 0.05
    adaptive_replan_min_interval: 5
    adaptive_replan_state_error_threshold: 3.0

  adaptive_async_realtime:
    extends: adaptive
    policy_type: async-mpc-icem
    async_planning: true
    async_worker_iterations: 2
    async_worker_device: cpu
    async_stale_tolerance: 1.0
    async_realtime_prefix_steps: 10

  adaptive_async_anytime:
    extends: adaptive_async_realtime
    async_anytime_prefix_steps: null
    async_anytime_min_iteration: 1
    async_anytime_std_tolerance: 0.75

  adaptive_state_fixed_update:
    extends: adaptive
    adaptive_update_eig_threshold: null


# Objective Ablation
  active_fully_observable:
    extends: active_planning
    objective_kind: fully_observable_parameter_eig

  active_e_optimality:
    extends: active_planning
    objective_kind: e_optimality

  active_state_information:
    extends: active_planning
    objective_kind: state_information

  active_dynamics:
    extends: active_planning
    objective_kind: dynamics

  active_observation_variance:
    extends: active_planning
    objective_kind: observation_variance

  active_state_variance:
    extends: active_planning
    objective_kind: state_variance

  active_laplace_corrected_observation_variance:
    objective_kind: corrected_observation_variance
    update_interval: 1
    replan_interval: 1
    planning_horizon: 20
    action_constraint: radius
    coarse_dt_factor: 20
    coarse_action_mapping: hold
