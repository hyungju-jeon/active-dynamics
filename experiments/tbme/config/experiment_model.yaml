models:
  active_myopic:
    objective_kind: parameter_eig
    update_interval: 1
    replan_interval: 1
    planning_horizon: 2
    action_constraint: radius

  active_planning:
    objective_kind: parameter_eig
    update_interval: 1
    replan_interval: 1
    planning_horizon: 20
    action_constraint: radius
    coarse_dt_factor: 20
    coarse_action_mapping: hold

  active_planning_async:
    extends: active_planning
    policy_type: async-mpc-icem
    async_planning: true

  tbme_active_nominal:
    extends: active_planning

  active_planning_u1_r1_h40:
    extends: active_planning
    update_interval: 1
    replan_interval: 1
    planning_horizon: 40

  active_planning_u5_r5_h40:
    extends: active_planning
    update_interval: 5
    replan_interval: 5
    planning_horizon: 40

  active_planning_u5_r10_h40:
    extends: active_planning
    update_interval: 5
    replan_interval: 10
    planning_horizon: 40

  active_planning_u5_r20_h40:
    extends: active_planning
    update_interval: 5
    replan_interval: 20
    planning_horizon: 40

  active_planning_u10_r20_h40:
