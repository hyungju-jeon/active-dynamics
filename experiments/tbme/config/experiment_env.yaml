environments:
  tbme_duffing:
    system_id: bistable_attractor
    system_label: duffing oscillator
    dynamics_type: duffing
    x_range: 5.0
    dt: 0.01
    latent_dim: 2
    action_dim: 2
    embedding_dim: 2
    min_embedding_dim: 2
    initial_parameter_mean: 0.0
    initial_parameter_variance: 0.25
    observation_dim: 20
    dynamics_alpha: 1.0
    state_noise: 0.1
    state_init_uncertainty: 1.0
    action_max: 1.0
    asymmetric_loading: false
    loading_target_snr_db: -5.0
    firing_rate_scale: 1
    observation_noise_scale: 1
    observation_noise_type: poisson
    mean_firing_rate_target: 20.0
    max_firing_rate_target: 100.0
    true_params:
    - -0.5
    - -0.75
    - 0.1
    state_low:
    - -5
    - -5
    state_high:
    - 5
    - 5
    boundary_enabled: true
    boundary_type: radial
    boundary_radius: 8.0
    boundary_barrier_enabled: true
    boundary_projection_enabled: true
    boundary_barrier_width: 0.5
    boundary_barrier_strength: 5.0
    boundary_barrier_temperature: 0.1
    information_boundary_visibility_enabled: true
    information_boundary_margin: 1.0
    information_boundary_temperature: 0.15

  tbme_duffing_asymmetric:
    extends: tbme_duffing
    system_label: hard duffing oscillator with asymmetric loading
    asymmetric_loading: true
    observation_primary_scale: 5.0

  tbme_duffing_parameter_mismatch:
    extends: tbme_duffing
    system_label: Duffing oscillator / mid fixed cubic-coefficient mismatch
    estimator_dynamics_type: duffing
    estimator_true_params:
    - -0.5
    - -0.75
    - 0.2

  tbme_duffing_parameter_mismatch_mild:
    extends: tbme_duffing
    system_label: Duffing oscillator / mild fixed cubic-coefficient mismatch
    estimator_dynamics_type: duffing
    estimator_true_params:
    - -0.5
    - -0.75
    - 0.15

  tbme_duffing_parameter_mismatch_strong:
    extends: tbme_duffing
    system_label: Duffing oscillator / strong fixed cubic-coefficient mismatch
    estimator_dynamics_type: duffing
    estimator_true_params:
    - -0.5
    - -0.75
    - 0.3

  tbme_duffing_observation_mismatch_mild:
    extends: tbme_duffing
    system_label: Duffing oscillator / mild observation-loading mismatch
    observation_loading_mismatch_variance: 0.01

  tbme_duffing_observation_mismatch_strong:
    extends: tbme_duffing
    system_label: Duffing oscillator / strong observation-loading mismatch
    observation_loading_mismatch_variance: 0.1

  tbme_duffing_observation_tuning_mismatch_mild:
    extends: tbme_duffing
    system_label: Duffing oscillator / mild observation tuning mismatch
    observation_loading_direction_mismatch_max_deg: 15.0
    observation_loading_gain_mismatch_max_factor: 1.25

  tbme_duffing_observation_tuning_mismatch_strong:
    extends: tbme_duffing
    system_label: Duffing oscillator / strong observation tuning mismatch
    observation_loading_direction_mismatch_max_deg: 30.0
    observation_loading_gain_mismatch_max_factor: 1.5

  tbme_damped_pendulum:
    extends: tbme_duffing
    system_id: damped_pendulum
    system_label: damped pendulum
    dynamics_type: damped_pendulum
    true_params:
    - -0.5
    - 1.0

  tbme_damped_pendulum_asymmetric:
    extends: tbme_duffing_asymmetric
    system_id: damped_pendulum
    system_label: damped pendulum with asymmetric loading
    dynamics_type: damped_pendulum
    true_params:
    - -0.5
    - 1.0


  tbme_gated_duffing:
    extends: tbme_duffing
    system_id: gated_duffing
    system_label: Gated Duffing
    dynamics_type: gated_duffing
    embedding_dim: 4
    true_params:
    - -1.2
    - -0.8
    - 0.5
    - 1.1

  tbme_gated_duffing_asymmetric:
    extends: tbme_duffing_asymmetric
    system_id: gated_duffing
    system_label: Gated Duffing
    dynamics_type: gated_duffing
    embedding_dim: 4
    true_params:
    - -1.2
    - -0.8
    - 0.5
    - 1.1

  tbme_gated_duffing_challenging:
    extends: tbme_gated_duffing_asymmetric
    system_label: Gated Duffing / challenging
    state_noise: 0.25
    loading_target_snr_db: -10.0
    action_max: 0.75

  tbme_gated_duffing_state_noise_mild:
    extends: tbme_gated_duffing
    system_label: Gated Duffing / mild state noise
    state_noise: 0.25
  
  tbme_gated_duffing_state_noise_strong:
    extends: tbme_gated_duffing
    system_label: Gated Duffing / strong state noise
    state_noise: 0.5

  tbme_gated_duffing_observation_bottleneck_mild:
    extends: tbme_gated_duffing
    system_label: Gated Duffing / mild observation SNR bottleneck
    loading_target_snr_db: -10.0

  tbme_gated_duffing_observation_bottleneck_strong:
    extends: tbme_gated_duffing
    system_label: Gated Duffing / strong observation SNR bottleneck
    loading_target_snr_db: -15.0

  tbme_gated_duffing_action_bottleneck_mild:
    extends: tbme_gated_duffing
    system_label: Gated Duffing / mild action bottleneck
    action_max: 0.75

  tbme_gated_duffing_action_bottleneck_strong:
    extends: tbme_gated_duffing
    system_label: Gated Duffing / strong action bottleneck
    action_max: 0.5

  tbme_gated_duffing_parameter_mismatch_mild:
    extends: tbme_gated_duffing
    system_label: Gated Duffing / mild fixed-parameter mismatch
    estimator_dynamics_type: gated_duffing
    estimator_true_params:
    - -1.2
    - -0.8
    - 0.5
    - 0.55
    embedding_dim: 3

  tbme_gated_duffing_parameter_mismatch_strong:
    extends: tbme_gated_duffing
    system_label: Gated Duffing / strong fixed-parameter mismatch
    estimator_dynamics_type: gated_duffing
    estimator_true_params:
    - -1.2
    - -0.8
    - 0.5
    - -1.0
    embedding_dim: 3

  tbme_gated_duffing_observation_mismatch_mild:
    extends: tbme_gated_duffing
    system_label: Gated Duffing / mild observation mismatch
    observation_loading_direction_mismatch_max_deg: 15.0
    observation_loading_gain_mismatch_max_factor: 1.25

  tbme_gated_duffing_observation_mismatch_strong:
    extends: tbme_gated_duffing
    system_label: Gated Duffing / strong observation mismatch
    observation_loading_direction_mismatch_max_deg: 30.0
    observation_loading_gain_mismatch_max_factor: 1.5
