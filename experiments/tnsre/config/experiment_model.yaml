models:
  active_myopic:
    objective_kind: parameter_eig
    update_interval: 1
    replan_interval: 1
    planning_horizon: 2
    action_constraint: radius

  active_planning:
    objective_kind: parameter_eig
    update_interval: 20
    replan_interval: 20
    planning_horizon: 40
    action_constraint: radius
    coarse_dt_factor: 20
    coarse_action_mapping: hold

  flex:
    objective_kind: null
    update_interval: 1
    replan_interval: 1
    planning_horizon: 1
    policy_type: flex
    flex_regularization: 0.01
    flex_parameter_step_clip: 0.25
    flex_parameter_min: -5.0
    flex_parameter_max: 5.0
    flex_lr: null

  flex_true_state:
    objective_kind: null
    update_interval: 1
    replan_interval: 1
    planning_horizon: 1
    policy_type: flex
    use_true_state: true
    flex_regularization: 0.01
    flex_parameter_step_clip: 0.25
    flex_parameter_min: -5.0
    flex_parameter_max: 5.0
    flex_lr: null

  flex_safe:
    extends: flex
    policy_type: flex
    flex_regularization: 0.1

  flex_filter:
    extends: flex
    policy_type: flex-upstream
    use_true_state: false
    flex_parameter_step_clip: null
    flex_parameter_min: null
    flex_parameter_max: null

  flex_true:
    extends: flex_filter
    use_true_state: true

  flex_rollback:
    extends: flex_safe
    policy_type: flex-rollback
    use_true_state: false

  rhc:
    objective_kind: null
    update_interval: 20
    replan_interval: 20
    planning_horizon: 20
    policy_type: rhc
    action_constraint: radius   # ball ||u|| <= action_max, as every TBME policy


  prbs:
    update_interval: 1
    replan_interval: 1
    planning_horizon: 1
    policy_type: baseline-prbs
    passive: true
    action_constraint: radius   # levels +-action_max / sqrt(2) per input: on the ball

  random:
    # The shared catalog's random policy (schedule u1_r1_h1) with the ball constraint: inputs uniform in
    # ||u|| <= action_max, as every TBME policy.
    schedule_id: u1_r1_h1
    policy_type: random
    passive: true
    action_constraint: radius


# Schedule Experiment
  active_planning_u1_r1_h40:
    extends: active_planning
    update_interval: 1
    replan_interval: 1
    planning_horizon: 40

  active_planning_u5_r5_h40:
    extends: active_planning
    update_interval: 5
    replan_interval: 5
    planning_horizon: 40

  active_planning_u5_r10_h40:
    extends: active_planning
    update_interval: 5
    replan_interval: 10
    planning_horizon: 40

  active_planning_u5_r20_h40:
    extends: active_planning
    update_interval: 5
    replan_interval: 20
    planning_horizon: 40

  active_planning_u10_r20_h40:
    extends: active_planning
    update_interval: 10
    replan_interval: 20
    planning_horizon: 40

  active_planning_u10_r10_h40:
    extends: active_planning
    update_interval: 10
    replan_interval: 10
    planning_horizon: 40


# Adaptive
  adaptive:
    extends: active_planning
    adaptive_cadence: true
    adaptive_update_min_interval: 5
    adaptive_update_eig_threshold: 0.05
    adaptive_replan_min_interval: 5
    adaptive_replan_state_error_threshold: 3.0

  # PALDI reacting at every step (2026-10-04): the parameter block may be applied, and a replan
  # triggered, after one step instead of five; the maximum intervals (20 steps) are unchanged.
  adaptive_reactive:
    extends: adaptive
    adaptive_update_min_interval: 1
    adaptive_replan_min_interval: 1

  # PALDI on a 2-bin planning grid with a faster cadence (SNN, 2026-10-06): planning step 2 bins
  # (10 ms) instead of 20, the same 4-s horizon (400 steps), and parameter updates and replans at
  # least 3 bins apart instead of 5; the maximum intervals (20 bins) are unchanged.
  adaptive_c2:
    extends: adaptive
    coarse_dt_factor: 2
    planning_horizon: 400
    adaptive_update_min_interval: 3
    adaptive_replan_min_interval: 3

  # PALDI c2 with a 200-ms horizon (SNN, 2026-10-06): 20 planning steps of 2 bins instead of 400, so a
  # rollout covers 200 ms of the 2-s trial; step and cadence as adaptive_c2.
  adaptive_c2h20:
    extends: adaptive_c2
    planning_horizon: 20

  adaptive_async_realtime:
    extends: adaptive
    policy_type: async-mpc-icem
    async_planning: true
    async_worker_iterations: 2
    async_worker_device: cpu
    async_stale_tolerance: 1.0
    async_realtime_prefix_steps: 10

  adaptive_async_anytime:
    extends: adaptive_async_realtime
    async_anytime_prefix_steps: null
    async_anytime_min_iteration: 1
    async_anytime_std_tolerance: 0.75

  adaptive_state_fixed_update:
    extends: adaptive
    adaptive_update_eig_threshold: null


# Objective Ablation
  active_fully_observable:
    extends: active_planning
    objective_kind: fully_observable_parameter_eig

  active_e_optimality:
    extends: active_planning
    objective_kind: e_optimality

  active_state_information:
    extends: active_planning
    objective_kind: state_information

  active_dynamics:
    extends: active_planning
    objective_kind: dynamics

  active_dynamics_logdet:
    extends: active_planning
    objective_kind: dynamics_logdet

  active_observation_variance:
    extends: active_planning
    objective_kind: observation_variance

  active_state_variance:
    extends: active_planning
    objective_kind: state_variance

  compound_active_planning:
    extends: active_planning
    coarse_dt_factor: 10

  compound_active_fully_observable:
    extends: active_fully_observable
    coarse_dt_factor: 10

  compound_active_e_optimality:
    extends: active_e_optimality
    coarse_dt_factor: 10

  compound_active_state_information:
    extends: active_state_information
    coarse_dt_factor: 10

  compound_active_dynamics:
    extends: active_dynamics
    coarse_dt_factor: 10

  compound_active_dynamics_logdet:
    extends: active_dynamics_logdet
    coarse_dt_factor: 10

  compound_active_observation_variance:
    extends: active_observation_variance
    coarse_dt_factor: 10

  compound_active_state_variance:
    extends: active_state_variance
    coarse_dt_factor: 10

  active_laplace_corrected_observation_variance:
    objective_kind: corrected_observation_variance
    update_interval: 1
    replan_interval: 1
    planning_horizon: 20
    action_constraint: radius
    coarse_dt_factor: 20
    coarse_action_mapping: hold

  # SNN manuscript PALDI: 200 ms horizon, 10 ms planning steps, 15 ms minimum cadence.
  adaptive_c2h20:
    extends: adaptive
    coarse_dt_factor: 2
    planning_horizon: 20
    adaptive_update_min_interval: 3
    adaptive_replan_min_interval: 3
