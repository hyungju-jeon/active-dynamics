[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actdyn"
version = "0.1.0"
description = "Active Learning for Latent Dynamical System Identification"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Hyungju Jeon", email = "hyungju.jeon@gmail.com" },
]
dependencies = [
    "casadi",
    "colorednoise",
    "cycler==0.12.1",
    "einops",
    "gym",
    "gymnasium",
    "gpytorch",
    "hydra-core",
    "hydra-joblib-launcher",
    "imageio[ffmpeg]",
    "matplotlib",
    "numpy",
    "omegaconf",
    "pandas",
    "pygame",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "seaborn",
    "tensorboard",
    "tensordict",
    "torch==2.11.0; sys_platform == 'darwin'",
    "torch==2.11.0+cpu; sys_platform != 'darwin'",
    "torchaudio==2.11.0; sys_platform == 'darwin'",
    "torchaudio==2.11.0+cpu; sys_platform != 'darwin'",
    "torchvision==0.26.0; sys_platform == 'darwin'",
    "torchvision==0.26.0+cpu; sys_platform != 'darwin'",
    "tqdm",
]

[project.scripts]
actdyn = "actdyn.cli:main"

[dependency-groups]
dev = [
    "ipykernel",
    "ipython",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["actdyn*"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
